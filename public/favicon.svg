<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OCY Hukuk">
  <!--
    SADELEŞTİRİLMİŞ amblem — yalnızca favicon içindir. Tam amblem için logo-mark.svg.

    Neden ayrı bir dosya: tam amblemde elmas çerçevenin çizgisi 2.5/448 birim.
    32px'lik bir sekmede bu 0,18 piksele denk gelir — görünmez. Yivler ve devre
    noktaları da aynı boyutta çamura döner. Bu yüzden burada çerçeve, yivler ve
    devre izleri atıldı; kalan öğeler kalınlaştırılıp tuvali dolduracak şekilde
    büyütüldü. Silüet (terazi + sütun) korunduğu için marka okunur kalıyor.

    Zemin lacivert: şeffaf favicon açık ve koyu sekme çubuklarında kayboluyor.
  -->
  <rect width="64" height="64" rx="13" fill="#1B3350" />

  <g fill="#FAF6EC">
    <!-- Terazi kolu ve uç topuzları -->
    <rect x="9" y="15.2" width="46" height="3.6" rx="1.8" />
    <circle cx="12" cy="17" r="3.4" />
    <circle cx="52" cy="17" r="3.4" />

    <!-- Askılar -->
    <rect x="11.2" y="20" width="1.6" height="6" />
    <rect x="51.2" y="20" width="1.6" height="6" />

    <!-- Kefeler — ince çerçeve yerine dolu çubuk, 16px'te ancak böyle okunuyor -->
    <rect x="6" y="25.5" width="12" height="3" rx="1.5" />
    <rect x="46" y="25.5" width="12" height="3" rx="1.5" />

    <!-- Sütun: mil, başlık, gövde, kaide -->
    <rect x="30" y="17" width="4" height="7" />
    <rect x="21" y="24" width="22" height="3.6" />
    <path d="M21 27.6 H43 L38.5 32 H25.5 Z" />
    <path d="M25.5 32 H38.5 L37.6 45 H26.4 Z" />
    <rect x="20" y="45" width="24" height="5" />
  </g>
</svg>
